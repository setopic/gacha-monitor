# 実装側の検査。**graph-check.yml とは別のファイルにしてある。**
# あちらはテンプレートが配るファイルで、ここに実装の検査を書き足すと
# テンプレートを取り込むたびに競合する。
#
# このファイルは .gitattributes の merge=ours で守られており、
# **プロジェクト側が書き換えてよい。** テンプレートの更新で上書きされない。
name: app-check

on:
  push:
  pull_request:

jobs:
  refs:
    # PR が実在する文書ノードを指しているかだけを見る。言語に依存しない。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: PR が指すノードが実在するか
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python .github/scripts/check_refs.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Apps Script にはローカルで走らせられるテストランナーが無い。
      # 実行できるのは Google の環境の中だけなので、**ここで確かめられるのは
      # 構文だけ**である。それでも価値はあった。開発中に、定義したまま
      # 呼び出していない関数（週次サマリーが永久に動かない不具合）を
      # この検査が拾っている。
      - name: Apps Script の構文を検査する
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/gs"
          for f in app/*.gs; do
            cp "$f" "$RUNNER_TEMP/gs/$(basename "$f" .gs).js"
          done
          for f in "$RUNNER_TEMP"/gs/*.js; do
            echo "checking $(basename "$f")"
            node --check "$f"
          done

      # **ファイルをまたぐ名前の衝突を見る。** Apps Script は全ての .gs が
      # 1 つのグローバル名前空間を共有し、同名の宣言は後に読まれたほうが勝つ。
      # 例外も警告も出ないので、機械が気づける場所はここしか無い（issue #10）。
      # 実際、spike.gs と monitor.gs が fmt_ / numOrNull_ / testLineNotify を
      # 二重定義したまま、上の構文検査を通り続けていた（issue #4）。
      #
      # **連結して ES モジュールとして解析する。** スクリプトとして解析すると
      # 関数宣言の重複は合法で通ってしまう。モジュールの最上位は字句宣言なので
      # SyntaxError になる。連結の順序は問わない。どちらが勝つかではなく、
      # 同じ名前が 2 つあることだけを見るためである。
      #
      # **見えないもの**: 最上位の var の重複。モジュールでも合法である。
      # いま app/*.gs に最上位の var は無い。
      #
      # **代償**: モジュールは常に strict なので、sloppy でしか書けない構文
      # （8 進数リテラル、with、仮引数の重複）が誤検出として落ちる。
      # **app/*.gs をそう書かないことが条件になる。**
      - name: ファイルをまたぐ名前の衝突を検査する
        run: |
          set -eu
          cat app/*.gs > "$RUNNER_TEMP/all.mjs"
          if node --check "$RUNNER_TEMP/all.mjs"; then
            echo "名前の衝突はありません"
          else
            echo "::error::app/*.gs に同じ名前の最上位の宣言があります。Apps Script は全ての .gs が 1 つのグローバル名前空間を共有するため、後に読まれたほうが黙って勝ちます"
            exit 1
          fi

      - name: マニフェストが JSON として読めるか
        run: node -e "JSON.parse(require('fs').readFileSync('app/appsscript.json','utf8'))"

      # 監視対象は設定シートにだけ置く（公開リポジトリなので残さない）。
      # 取り違えて書き戻したときに気づけるようにしておく。
      - name: 監視対象がコードに書かれていないか
        run: |
          set -eu
          if grep -rn "監視アカウント', *'[^']" app/ ; then
            echo "::error::設定シートの初期値に監視対象が書かれています。空にしてください"
            exit 1
          fi
          echo "監視対象はコードに含まれていません"
