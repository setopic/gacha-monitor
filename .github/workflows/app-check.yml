      #   with:
      #     python-version: "3.12"
      # - run: pip install -r requirements.txt
      # - run: python -m pytest

      # --- TypeScript / Node の例 ---
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
