name: graph-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # G011（放置された未確定ノードの検出）は git 履歴の日付を使う。
          # 既定の浅いクローンだと全ファイルが同じ日付になり、検査が飛ばされる。
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 外部依存はないので install なし
      - name: テストを走らせる
        run: python -m unittest discover -s tests -t .

      # main では警告も失敗にする（--strict）。
      # 開発中のブランチと PR では警告を出すだけにして、作業の途中で止めない。
      # 警告（G009〜G015）は「直すべきだが、今すぐ壊れてはいない」もの。
      #
      # PR では G015（追従漏れ）の窓を base ブランチまで広げる。
      # 「この PR で依存先を変えたが、依存元を見ていない」の一覧が出る。
      # 失敗にはしない。追従が要るかどうかは人が決める。
      - name: グラフを検証する（main は strict / PR は追従漏れも見る）
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "main への push なので --strict で検証します"
            python -m tools.graph check --strict
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR なので origin/${{ github.base_ref }} との差分で G015 も見ます"
            python -m tools.graph check --since "origin/${{ github.base_ref }}"
          else
            echo "警告は失敗にしません（main への push だけ --strict）"
            python -m tools.graph check
          fi

      - name: 関連ドキュメントが最新か確かめる
        run: python -m tools.graph sync --check

      # [[ID]] のままだと GitHub 上でただの文字として出る（クリックできない）。
      # 相対リンクに直っているかを見る。グラフは両方を同じ mentions として
      # 扱うので、直しても検証結果は変わらない。
      - name: 本文の参照がリンクになっているか確かめる
        run: python -m tools.graph linkify --check

      # make 経由で呼ぶ。graph.mk の README_GRAPH_ARGS（--aggregate など）を
      # 効かせるため。直接 python を叩くと、間引いているリポジトリで
      # 「図が古い」と誤判定して落ちる。
      - name: README の図が最新か確かめる
        run: make readme-check

      - name: 集計を出す
        if: always()
        run: python -m tools.graph stats

      # AI lint（graph review）はここで回さない。
      # 指摘が再現せず、API キーと費用と通信が要るため。人が手で回す。

  # 本番ホスト（Ubuntu 22.04）の Python は 3.10 で、OS ごと入れ替えない限り
  # 動かせない。**下限を宣言したまま検査しないと、宣言はいずれ腐る。**
  # 開発機と CI 本体は 3.12 のまま、下限で動くことだけをここで見る。
  #
  # 図の再生成や sync の鮮度は見ない。版に依らないので本体ジョブで足りる。
  # ここが落ちたら「3.11 以降の書き方が混ざった」という意味で、
  # 直すか、下限を上げるかを決める（version.py の MIN_PYTHON と対で動かす）。
  floor:
    name: 下限の版で動くか (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: テストを走らせる
        run: python -m unittest discover -s tests -t .

      - name: 検証できることを確かめる
        run: python -m tools.graph check
